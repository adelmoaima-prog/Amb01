version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: amb_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ambulatorio}
      POSTGRES_USER: ${POSTGRES_USER:-ambuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambpass2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambuser} -d ${POSTGRES_DB:-ambulatorio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amb-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amb_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ambuser}:${POSTGRES_PASSWORD:-ambpass2024}@postgres:5432/${POSTGRES_DB:-ambulatorio}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey-change-in-production-min32chars}
      FERNET_KEY: ${FERNET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MFA_BYPASS_DEV: ${MFA_BYPASS_DEV:-true}
    volumes:
      - ./backend:/app
      - backend_reports:/app/reports
    networks:
      - amb-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amb_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - amb-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: amb_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_reports:/reports:ro
    networks:
      - amb-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_reports:

networks:
  amb-network:
    driver: bridge
